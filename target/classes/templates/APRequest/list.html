<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${rol == 'TECNICO' ? 'SgOVI - Gestión de Peticiones' : 'SgOVI - Mis Peticiones'}">SgOVI - Peticiones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/usuarioOVI.css}" />
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand text-teal fw-bold" th:href="${rol == 'TECNICO' ? '/TecnicoOVI/dashboard' : '/UsuarioOVI/dashboard'}">
                SgOVI - <span th:text="${rol == 'TECNICO' ? 'Gestión Técnica' : 'Área Personal'}">Área Personal</span>
            </a>
            <div class="d-flex align-items-center">
                <a th:href="${rol == 'TECNICO' ? '/TecnicoOVI/logout' : '/UsuarioOVI/logout'}" class="btn btn-outline-danger btn-sm fw-bold">
                    Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="text-teal fw-bold mb-0" th:text="${rol == 'TECNICO' ? 'Gestión de Peticiones de Asistencia' : 'Mis Peticiones de Asistencia'}">Peticiones</h2>
                    <a th:href="${rol == 'TECNICO' ? '/TecnicoOVI/dashboard' : '/UsuarioOVI/dashboard'}" class="btn btn-teal">Volver</a>
                </div>

                <table class="table table-striped table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha Solicitud</th>
                            <th>Título</th>
                            <th>Estado</th>
                            <th th:if="${rol == 'TECNICO'}">Usuario</th>
                            <th th:if="${rol != 'TECNICO'}">Asistente</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="request : ${requests}">
                            <td th:text="${#temporals.format(request.fechaSolicitud, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td th:text="${request.titulo}">Título</td>
                            <td>
                                <span th:text="${request.estado}" class="badge bg-secondary">Estado</span>
                            </td>
                            
                            <td th:if="${rol == 'TECNICO'}" th:text="${nombresUsuarios[request.idUsuario]}">Nombre del Usuario</td>

                            <td th:if="${rol != 'TECNICO'}">
                                <span th:if="${request.idSeleccion != null}" class="fw-bold text-success">
                                    Asistente Asignado
                                </span>
                                <span th:unless="${request.idSeleccion != null}" class="text-muted small">
                                    Buscando asistente...
                                </span>
                            </td>

                            <td class="text-center">
                                <div class="btn-action-group">
                                    <th:block th:if="${rol == 'TECNICO'}">
                                        <a th:href="@{/APRequest/gestion/{id}(id=${request.idRequest})}" class="btn btn-teal btn-sm fw-bold px-3">
                                            Gestionar petición
                                        </a>
                                    </th:block>
                                    
                                    <th:block th:if="${rol != 'TECNICO'}">
                                        <a th:if="${request.idSeleccion == null}" 
                                           th:href="@{/APRequest/candidatos/{id}(id=${request.idRequest})}" 
                                           class="btn btn-info btn-sm">
                                            Ver asistentes
                                        </a>
                                        <span th:if="${request.idSeleccion != null}" class="badge bg-success py-2 px-3">
                                            Completado
                                        </span>
                                    </th:block>
                                </div>
                            </td>
                        </tr>
                        
                        <tr th:if="${#lists.isEmpty(requests)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                No hay solicitudes registradas.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
