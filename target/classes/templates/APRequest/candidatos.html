<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>SgOVI - Candidatos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/database.css}">

    <style>
        .text-teal { color: #0d9488 !important; }
        .btn-teal { background-color: #0d9488 !important; color: white !important; }
        .btn-teal:hover { background-color: #0f766e !important; }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-teal fw-bold"
           th:href="${rol == 'TECNICO'} ? @{/APRequest/list} : @{/UsuarioOVI/list}">
            SgOVI - Candidatos
        </a>
    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-teal fw-bold mb-0"
            th:text="${rol == 'TECNICO'} ? 'Lista de candidatos' : 'Candidatos propuestos'">
        </h2>

        <!-- VOLVER -->
        <a th:if="${rol == 'TECNICO'}"
            th:href="@{/APRequest/assign/{id}(id=${idSolicitud})}"
            class="btn btn-teal">
                Volver
        </a>

        <a th:if="${rol == 'USUARIO'}"
            th:href="@{/APRequest/list}"
            class="btn btn-teal">
                Volver
        </a>

    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0 database">

                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Zona</th>
                        <th>Disponibilidad</th>
                        <th>Acción</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="asistente : ${candidatos}">

                        <td class="fw-bold"
                            th:text="${asistente.nombre + ' ' + asistente.apellidos}">
                        </td>

                        <td th:text="${asistente.email}"></td>
                        <td th:text="${asistente.telefono}"></td>
                        <td th:text="${asistente.zona}"></td>
                        <td th:text="${asistente.disponibilidad}"></td>

                        <td>

                            <!-- TÉCNICO: quitar -->
                            <a th:if="${rol == 'TECNICO'}"
                               th:href="@{/APRequest/candidatos/delete/{idSolicitud}/{idAsistente}(
                                    idSolicitud=${idSolicitud},
                                    idAsistente=${asistente.idAsistente})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Quitar este candidato?')">
                                Quitar candidato
                            </a>

                            <!-- USUARIO: chat -->
                            <a th:if="${rol == 'USUARIO'}"
                               th:href="@{/Chat/{id}(id=${asistente.idAsistente})}"
                               class="btn btn-primary btn-sm">
                                Chat
                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(candidatos)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            No hay candidatos
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</main>
    <th:block th:replace="fragments/datatable :: scripts"></th:block>
</body>
</html>
