<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Gestión de Chats</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/usuarioOVI.css}" />
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand text-teal fw-bold" th:href="@{/TecnicoOVI/dashboard}">
                SgOVI - Gestión Técnica
            </a>
            <div class="d-flex align-items-center">
                <a th:href="@{/TecnicoOVI/logout}" class="btn btn-outline-danger btn-sm fw-bold">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-teal fw-bold">Historial Global de Chats</h2>
            <a th:href="@{/TecnicoOVI/dashboard}" class="btn btn-teal">Volver</a>
        </div>

        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 text-center">
                    <thead class="table-light">
                        <tr>
                            <th>Nº</th>
                            <th>Usuario</th>
                            <th>Asistente</th>
                            <th>Fecha Creación</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="chat, status : ${chats}">
                            <td class="fw-bold text-muted" th:text="${status.count}">1</td>
                            <td>
                                <span class="fw-semibold" th:text="${chat.nombreUsuario}">Nombre Usuario</span>
                            </td>
                            <td>
                                <span class="fw-semibold" th:text="${chat.nombreAsistente}">Nombre Asistente</span>
                            </td>
                            <td th:text="${#dates.format(chat.fechaCreacion, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                            <td>
                                <span class="badge rounded-pill" 
                                      th:classappend="${chat.estado == 'activo' || chat.estado == 'ACTIVO'} ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'"
                                      th:text="${chat.estado != null ? chat.estado.toUpperCase() : 'ACTIVO'}">
                                    ACTIVO
                                </span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/chat/tecnico/ver/{id}(id=${chat.idChat})}" class="btn btn-outline-teal btn-sm fw-bold">
                                    Ver Chat
                                </a>
                            </td>
                        </tr>
                        
                        <tr th:if="${#lists.isEmpty(chats)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                No hay chats registrados en el sistema.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</body>
</html>
