<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="buscador(action)">

<form method="get" class="row mb-3">

    <!-- Filtro -->
    <div class="col-md-3" th:if="${mostrarZona}">
        <select name="zona" class="form-select">
            <option value="">Todas las zonas</option>
            <option value="Castellón"
                    th:selected="${zona == 'Castellón'}">Castellón</option>
            <option value="Benicàssim"
                    th:selected="${zona == 'Benicàssim'}">Benicàssim</option>
            <option value="Vila-real"
                    th:selected="${zona == 'Vila-real'}">Vila-real</option>
        </select>
    </div>

    <!-- Buscar -->
    <div class="col-md-4">
        <label for="buscar" class="visually-hidden">Buscar</label>
        <input
            id="buscar"
            type="text"
            name="buscar"
            class="form-control"
            placeholder="Buscar..."
            th:value="${buscar}">
    </div>
    <div class="col-auto">
        <button class="btn btn-teal">
            Buscar
        </button>
    </div>

</form>

</div>

</body>
</html>
