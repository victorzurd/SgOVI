<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>SgOVI - Solicitudes de Asistentes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/asistentePersonal.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/database.css}">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-teal fw-bold" th:href="@{/TecnicoOVI/dashboard}">
            SgOVI - Gestión Técnica
        </a>

        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/AsistentePersonal/list}" class="btn btn-outline-secondary btn-sm fw-bold">
                ← Lista general
            </a>
            <a th:href="@{/TecnicoOVI/logout}" class="btn btn-outline-danger btn-sm fw-bold">
                Cerrar Sesión
            </a>
        </div>
    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-teal fw-bold mb-0">
            📥 Solicitudes pendientes de validación
        </h2>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-0">

            <table class="table table-striped table-hover align-middle mb-0 database">
                <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Contacto</th>
                    <th>Zona</th>
                    <th>Disponibilidad</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="asistente : ${asistentes}">

                    <td>
                        <span class="fw-bold"
                              th:text="${asistente.nombre + ' ' + asistente.apellidos}">
                        </span>
                    </td>

                    <td>
                        <div th:text="${asistente.email}"></div>
                        <small class="text-muted" th:text="${asistente.telefono}"></small>
                    </td>

                    <td th:text="${asistente.zona}"></td>

                    <td th:text="${asistente.disponibilidad}"></td>

                    <td class="text-center">

                        <a th:href="@{/AsistentePersonal/aceptar/{id}(id=${asistente.idAsistente})}"
                           class="btn btn-success btn-sm fw-bold"
                           onclick="return confirm('¿Aceptar este asistente?')">
                            ✔ Aceptar
                        </a>

                        <a th:href="@{/AsistentePersonal/rechazar/{id}(id=${asistente.idAsistente})}"
                           class="btn btn-danger btn-sm fw-bold"
                           onclick="return confirm('¿Rechazar y eliminar este asistente?')">
                            ✕ Rechazar
                        </a>

                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(asistentes)}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        No hay solicitudes pendientes.
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </div>

</main>
    <th:block th:replace="fragments/datatable :: scripts"></th:block>
</body>
</html>
