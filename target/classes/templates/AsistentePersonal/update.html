<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>SgOVI - Editar Perfil Asistente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    
    <link rel="stylesheet" type="text/css" th:href="@{/css/asistentePersonal.css}" />
    
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-teal fw-bold" th:href="@{/AsistentePersonal/main}">
                SgOVI - Área Profesional
            </a>
            <div class="d-flex align-items-center">
                <a th:href="@{/AsistentePersonal/main}" class="btn btn-outline-secondary btn-sm fw-bold me-2">
                    ← Volver al Panel
                </a>
                <a href="/AsistentePersonal/logout" class="btn btn-outline-danger btn-sm fw-bold">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 900px;">

        <div class="mb-4">
            <h2 class="text-teal fw-bold mb-1">Modificar Perfil Profesional</h2>
            <p class="text-muted small">Actualiza tus datos de contacto, zona geográfica o disponibilidad en la Bolsa de Trabajo OVI.</p>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">

                <form th:action="@{/AsistentePersonal/update}" th:object="${asistente}" method="post">
                    
                    <input type="hidden" th:field="*{idAsistente}">
                    <input type="hidden" th:field="*{estadoAceptado}">
                    <input type="hidden" th:field="*{activo}">
                    <input type="hidden" th:field="*{puntuacion}">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Nombre</label>
                            <input type="text" 
                                   th:field="*{nombre}" 
                                   class="form-control" 
                                   placeholder="Nombre"
                                   th:errorclass="needcorrection">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Apellidos</label>
                            <input type="text" 
                                   th:field="*{apellidos}" 
                                   class="form-control" 
                                   placeholder="Apellidos"
                                   th:errorclass="needcorrection">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Correo Electrónico</label>
                            <input type="email" 
                                   th:field="*{email}" 
                                   class="form-control" 
                                   placeholder="Correo Electrónico"
                                   th:errorclass="needcorrection">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Teléfono de Contacto</label>
                            <input type="text" 
                                   th:field="*{telefono}" 
                                   class="form-control" 
                                   maxlength="9" 
                                   placeholder="Teléfono"
                                   th:errorclass="needcorrection">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Zona de Cobertura / Municipio</label>
                            <input type="text" 
                                   th:field="*{zona}" 
                                   class="form-control" 
                                   placeholder="Zona de Cobertura / Municipio"
                                   th:errorclass="needcorrection">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('zona')}" th:errors="*{zona}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Preferencias de Servicio</label>
                            <input type="text" 
                                   th:field="*{preferencias}" 
                                   class="form-control" 
                                   placeholder="Preferencias de Servicio"
                                   th:errorclass="needcorrection">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('preferencias')}" th:errors="*{preferencias}"></div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-teal">Disponibilidad Horaria</label>
                        <textarea th:field="*{disponibilidad}" 
                                  class="form-control" 
                                  rows="3" 
                                  placeholder="Disponibilidad Horaria"
                                  th:errorclass="needcorrection"></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('disponibilidad')}" th:errors="*{disponibilidad}"></div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                        <button type="submit" class="btn btn-teal fw-bold px-4 py-2">
                            Guardar Cambios
                        </button>
                        <a th:href="@{/AsistentePersonal/perfil}" class="btn btn-outline-secondary fw-bold px-4 py-2">
                            Cancelar
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </main>

</body>

</html>
