<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Iniciar Sesión Asistente</title>

    <!-- Frameworks externos (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Base Reutilizable del Sistema de Diseño -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/sgovi-style.css}" />

    <style>
        .login-container {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background-color: var(--sg-card-bg);
            border: 1px solid var(--sg-border);
            border-radius: var(--sg-radius);
            box-shadow: var(--sg-shadow);
        }

        .input-group-text {
            background-color: transparent;
            border-color: #CBD5E1;
            color: var(--sg-muted);
        }

        .form-control:focus {
            border-color: var(--sg-primary);
            box-shadow: 0 0 0 0.25rem rgba(13, 148, 136, 0.15);
        }
    </style>
</head>

<body>

    <!-- Barra Superior de Accesibilidad -->
    <div class="accessibility-bar">
        <div class="container d-flex justify-content-between align-items-center">
            <span><i class="bi bi-universal-access me-1"></i> Accesibilidad y Usabilidad</span>
            <div class="d-flex gap-3">
                <button onclick="toggleFontSize('increase')"><i class="bi bi-zoom-in"></i> Texto +</button>
                <button onclick="toggleFontSize('decrease')"><i class="bi bi-zoom-out"></i> Texto -</button>
                <button onclick="toggleContrast()"><i class="bi bi-circle-half"></i> Alto Contraste</button>
            </div>
        </div>
    </div>

    <!-- Navegación Principal Simplificada -->
    <nav class="navbar navbar-custom">
        <div class="container justify-content-between">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-heart-pulse-fill text-teal"></i> SgOVI
            </a>
            <a th:href="@{/Inicio/logins}" class="btn btn-sg-outline btn-sm px-3">
                <i class="bi bi-arrow-left me-1"></i> Cambiar Perfil
            </a>
        </div>
    </nav>

    <!-- Contenedor del Formulario -->
    <main class="container login-container my-4">
        <div class="login-card p-4 p-md-5">
            
            <!-- Encabezado de la Tarjeta (Identidad Asistente Personal PAP/PATI) -->
            <div class="text-center mb-4">
                <div class="pillar-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem;">
                    <i class="bi bi-person-badge-fill"></i>
                </div>
                <span class="hero-badge mb-2">
                    <i class="bi bi-shield-lock-fill"></i> Portal del Asistente Personal
                </span>
                <h1 class="h3 fw-bold text-dark mt-2">Inicia Sesión</h1>
                <p class="text-muted small">Acceso para profesionales PAP / PATI</p>
            </div>

            <!-- Alerta de Error de Autenticación -->
            <div th:if="${error != null}" class="alert alert-danger d-flex align-items-center gap-2 p-3 mb-4 rounded-3 border-0 shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0 text-danger"></i>
                <div th:text="${error}" class="fw-semibold small m-0">Credenciales incorrectas</div>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form th:action="@{/AsistentePersonal/login}" method="post" th:object="${asistente}">
                
                <!-- Campo: Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold text-dark small mb-1">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" class="form-control py-2" id="email" th:field="*{email}" placeholder="nombre@ejemplo.com" required autofocus>
                    </div>
                </div>

                <!-- Campo: Contraseña con Ojo Interactivo -->
                <div class="mb-4">
                    <label for="contraseña" class="form-label fw-bold text-dark small mb-1">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                        <input type="password" class="form-control py-2" id="contraseña" th:field="*{contraseña}" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary px-3" type="button" id="btnTogglePassword" onclick="togglePasswordVisibility()" aria-label="Mostrar u ocultar contraseña">
                            <i class="bi bi-eye-fill" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Botón de Entrar -->
                <button class="w-100 btn btn-sg-primary py-3 fs-6 d-inline-flex align-items-center justify-content-center gap-2" type="submit">
                    <i class="bi bi-box-arrow-in-right fs-5"></i> Entrar al Portal
                </button>
                
                <!-- Enlaces de Navegación y Registro -->
                <div class="text-center mt-4 pt-2 border-top">
                    <p class="text-secondary small mb-2">
                        ¿No estás registrado? 
                        <a th:href="@{/AsistentePersonal/register}" class="text-teal fw-bold text-decoration-none ms-1">
                            Regístrate aquí <i class="bi bi-arrow-right-short"></i>
                        </a>
                    </p>
                    <a th:href="@{/Inicio/logins}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Volver a la selección de perfiles
                    </a>
                </div>

            </form>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-top py-3 text-center text-muted small">
        <div class="container">
            <p class="m-0"><strong>SgOVI</strong> &copy; 2026 - Plataforma para la Vida Independiente</p>
        </div>
    </footer>

    <!-- Bootstrap & Scripts de Funcionalidad -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Cambiar tamaño de letra
        function toggleFontSize(action) {
            const currentSize = parseFloat(window.getComputedStyle(document.body).fontSize);
            if (action === 'increase' && currentSize < 22) {
                document.body.style.fontSize = (currentSize + 1.5) + 'px';
            } else if (action === 'decrease' && currentSize > 13) {
                document.body.style.fontSize = (currentSize - 1.5) + 'px';
            }
        }

        // Modo Alto Contraste
        function toggleContrast() {
            document.body.classList.toggle('high-contrast');
        }

        // Alternar Visibilidad de Contraseña
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('contraseña');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye-fill');
                eyeIcon.classList.add('bi-eye-slash-fill');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye-slash-fill');
                eyeIcon.classList.add('bi-eye-fill');
            }
        }
    </script>
</body>

</html>
