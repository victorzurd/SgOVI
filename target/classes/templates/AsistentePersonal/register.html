<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>SgOVI - Registrar Asistente Personal</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    
    <link rel="stylesheet" type="text/css" th:href="@{/css/asistentePersonal.css}" />

</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-teal fw-bold" th:href="@{/}">
                SgOVI - Asistente Personal
            </a>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 900px;">

        <div class="mb-4">
            <h2 class="text-teal fw-bold mb-1">Registrar Asistente Personal</h2>
            <p class="text-muted small">Completa el formulario para registrar tu perfil como Asistente Profesional (PAP / PATI).</p>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">

                <form th:action="@{/AsistentePersonal/register}" th:object="${asistente}" method="post">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Nombre</label>
                            <input type="text"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   placeholder="Nombre"
                                   th:errorclass="needcorrection" />
                            <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Apellidos</label>
                            <input type="text"
                                   th:field="*{apellidos}"
                                   class="form-control"
                                   placeholder="Apellidos"
                                   th:errorclass="needcorrection" />
                            <div th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="text-danger small mt-1"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Correo Electrónico</label>
                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="Correo Electrónico (ejemplo@correo.com)"
                                   th:errorclass="needcorrection" />
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Contraseña de Acceso</label>
                            <input type="password"
                                   th:field="*{contraseña}"
                                   class="form-control"
                                   placeholder="Contraseña de Acceso"
                                   th:errorclass="needcorrection" />
                            <div th:if="${#fields.hasErrors('contraseña')}" th:errors="*{contraseña}" class="text-danger small mt-1"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Teléfono de Contacto</label>
                            <input type="text"
                                   th:field="*{telefono}"
                                   class="form-control"
                                   maxlength="9"
                                   placeholder="Teléfono (ej. 600000000)"
                                   th:errorclass="needcorrection" />
                            <div th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-teal">Zona de Cobertura / Municipio</label>
                            <input type="text"
                                   th:field="*{zona}"
                                   class="form-control"
                                   placeholder="Zona / Municipio (ej. Castelló de la Plana)"
                                   th:errorclass="needcorrection" />
                            <div th:if="${#fields.hasErrors('zona')}" th:errors="*{zona}" class="text-danger small mt-1"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-teal">Preferencias de Servicio</label>
                        <input type="text"
                               th:field="*{preferencias}"
                               class="form-control"
                               placeholder="Preferencias (ej. Asistencia PAP nocturna, Terapia PATI Infantil...)"
                               th:errorclass="needcorrection" />
                        <div th:if="${#fields.hasErrors('preferencias')}" th:errors="*{preferencias}" class="text-danger small mt-1"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-teal">Disponibilidad Horaria</label>
                        <textarea th:field="*{disponibilidad}"
                                  class="form-control"
                                  rows="3"
                                  placeholder="Disponibilidad (ej. Tardes de lunes a viernes, Fines de semana completo...)"
                                  th:errorclass="needcorrection"></textarea>
                        <div th:if="${#fields.hasErrors('disponibilidad')}" th:errors="*{disponibilidad}" class="text-danger small mt-1"></div>
                    </div>

                    <div class="mb-4 p-3 bg-light rounded-3 border">
                        <div class="form-check m-0">
                            <input class="form-check-input" type="checkbox" th:field="*{consentimientoRGBD}" id="checkRGPD"/>
                            <label class="form-check-label fw-semibold text-dark small" for="checkRGPD">
                                Acepto el Consentimiento de protección de datos RGPD.
                            </label>
                        </div>
                        <div th:if="${#fields.hasErrors('consentimientoRGBD')}" th:errors="*{consentimientoRGBD}" class="text-danger small mt-1 fw-bold"></div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                        <button type="submit" class="btn btn-teal fw-bold px-4 py-2">
                            Solicitar Registro
                        </button>
                        <a th:href="@{/}" class="btn btn-outline-secondary fw-bold px-4 py-2">
                            Cancelar
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </main>
</body>

</html>
