<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Mis Contratos Activos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" type="text/css" th:href="@{/css/asistentePersonal.css}" />
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-teal fw-bold"
           th:href="@{/AsistentePersonal/main}">
            SgOVI - Área Profesional
        </a>

        <div class="d-flex align-items-center">
            <a th:href="@{/AsistentePersonal/main}"
               class="btn btn-outline-secondary btn-sm fw-bold me-2">
                ← Volver al Panel
            </a>

            <a th:href="@{/AsistentePersonal/logout}"
               class="btn btn-outline-danger btn-sm fw-bold">
                Cerrar Sesión
            </a>
        </div>
    </div>
</nav>

<main class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-teal fw-bold mb-0">
            Contratos de Asistencia en Vigor
        </h2>
    </div>

    <th:block
        th:replace="~{fragments/buscador(action='/AsistentePersonal/contratos')}"/>

    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0 database">

                <thead class="table-light">
                <tr>
                    <th class="ps-4">ID Contrato</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Estado</th>
                    <th class="text-center">Documento</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="contrato : ${contratosAsistente}">

                    <td class="ps-4 fw-bold text-teal"
                        th:text="'#' + ${contrato.idContrato}">
                    </td>

                    <td th:text="${contrato.fechaInicio}">
                    </td>

                    <td th:text="${contrato.fechaFin != null ? contrato.fechaFin : 'Indefinido'}">
                    </td>

                    <td>

                        <div th:switch="${contrato.estado}">

                            <span th:case="'con_contrato'"
                                  class="badge rounded-pill bg-success">
                                Vigente
                            </span>

                            <span th:case="'finalizada'"
                                  class="badge rounded-pill bg-secondary">
                                Finalizado
                            </span>

                            <span th:case="*"
                                  class="badge rounded-pill bg-dark"
                                  th:text="${contrato.estado}">
                            </span>

                        </div>

                    </td>

                    <td class="text-center">

                        <a th:if="${contrato.documentoPdf != null && !contrato.documentoPdf.isEmpty()}"
                           th:href="@{/contratos/{pdf}(pdf=${contrato.documentoPdf})}"
                           target="_blank"
                           class="btn btn-outline-primary btn-sm fw-bold">

                            📄 Abrir contrato

                        </a>

                        <span th:if="${contrato.documentoPdf == null || contrato.documentoPdf.isEmpty()}"
                              class="text-muted">

                            No disponible

                        </span>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(contratosAsistente)}">

                    <td colspan="5"
                        class="text-center py-5 text-muted">

                        No tienes contratos asignados.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<th:block
        th:replace="~{fragments/paginacion :: paginacion('/AsistentePersonal/contratos')}"/>

</body>
</html>
