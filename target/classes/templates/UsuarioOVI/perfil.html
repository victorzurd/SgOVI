<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>SgOVI - Mi Perfil</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          type="text/css"
          th:href="@{/css/usuarioOVI.css}" />
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand text-teal fw-bold" th:href="@{/UsuarioOVI/dashboard}">
                SgOVI - Área Personal
            </a>
            <div class="d-flex align-items-center">
                <a th:href="@{/UsuarioOVI/logout}" class="btn btn-outline-danger btn-sm fw-bold">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-teal fw-bold">Mi Perfil</h2>
            <a th:href="@{/UsuarioOVI/dashboard}" class="btn btn-teal">Volver</a>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="fw-bold text-teal">Nombre</label>
                        <p th:text="${usuario.nombre}"></p>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold text-teal">Apellidos</label>
                        <p th:text="${usuario.apellidos}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="fw-bold text-teal">Email</label>
                        <p th:text="${usuario.email}"></p>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold text-teal">Teléfono</label>
                        <p th:if="${usuario.telefono != null and usuario.telefono != ''}" th:text="${usuario.telefono}"></p>
                        <p th:unless="${usuario.telefono != null and usuario.telefono != ''}" class="text-muted fst-italic">No especificado</p>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="fw-bold text-teal">Dirección</label>
                    <p th:if="${usuario.direccion != null and usuario.direccion != ''}" th:text="${usuario.direccion}"></p>
                    <p th:unless="${usuario.direccion != null and usuario.direccion != ''}" class="text-muted fst-italic">No especificado</p>
                </div>

                <div class="d-flex gap-3 align-items-center">
                    
                    <a th:href="@{/UsuarioOVI/edit}" class="btn btn-teal fw-bold">
                        Editar Perfil
                    </a>

                    <a th:href="@{/UsuarioOVI/delete}" class="btn btn-danger fw-bold">
                        Eliminar Perfil
                    </a>

                </div>

            </div>
        </div>

    </main>

</body>
</html>
