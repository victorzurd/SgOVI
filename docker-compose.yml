services:
  postgres-db:
    image: postgres:15-alpine
    container_name: sgovi_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-sgovi_db}
      POSTGRES_USER: ${DB_USERNAME:-sgovi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgovi_password}
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
