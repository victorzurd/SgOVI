<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Iniciar Sesión Asistente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    
    <link rel="stylesheet" type="text/css" th:href="@{/css/asistentePersonal.css}" />

</head>

<body>

    <main class="form-signin">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
            
            <div class="text-center mb-4">
                <h1 class="h3 mb-3 fw-bold text-teal">SgOVI</h1>
                <p class="text-muted small">Portal del Asistente Personal (PAP/PATI)</p>
            </div>

            <div th:if="${error != null}" class="alert alert-danger text-center py-2 mb-3 rounded">
                <span th:text="${error}" class="fw-bold small">Credenciales incorrectas</span>
            </div>

            <form th:action="@{/AsistentePersonal/login}" method="post" th:object="${asistente}">
                
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="nombre@ejemplo.com" required>
                    <label for="email" class="text-muted">Correo Electrónico</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="contraseña" th:field="*{contraseña}" placeholder="Contraseña" required>
                    <label for="contraseña" class="text-muted">Contraseña</label>
                </div>

                <button class="w-100 btn btn-lg btn-teal fw-bold" type="submit">Entrar</button>
                
                <div class="text-center mt-4">
                    <p class="text-muted small mb-1">¿No estás registrado? <a th:href="@{/AsistentePersonal/register}" class="text-teal fw-bold text-decoration-none">Regístrate aquí</a></p>
                    <a th:href="@{/Inicio/logins}" class="text-muted small text-decoration-none">← Volver</a>
                </div>

            </form>
        </div>
    </main>

    
</body>

</html>
