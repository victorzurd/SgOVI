<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Modificar Estado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/usuarioOVI.css}" />
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-teal fw-bold" th:href="@{/TecnicoOVI/dashboard}">SgOVI - Gestión Técnica</a>
            <div class="d-flex align-items-center">
                <a th:href="@{/TecnicoOVI/logout}" class="btn btn-outline-danger btn-sm fw-bold">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="text-teal fw-bold">Modificar Estado de la Petición</h2>
                    <a th:href="@{/APRequest/gestion/{id}(id=${apRequest.idRequest})}" class="btn btn-outline-secondary">Volver a gestión</a>
                </div>

                <div class="card shadow-sm border-0 rounded-3 p-4">
                    <form action="#" th:action="@{/APRequest/update}" th:object="${apRequest}" method="post">
            
                        <input type="hidden" th:field="*{idRequest}" />
                        <input type="hidden" th:field="*{idUsuario}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Título / Asunto:</label>
                            <input type="hidden" th:field="*{titulo}" />
                            <input type="text" class="form-control bg-light" th:value="*{titulo}" disabled />
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha de Solicitud:</label>
                                <input type="hidden" th:field="*{fechaSolicitud}" />
                                <input type="text" class="form-control bg-light" th:value="*{fechaSolicitud}" disabled />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Zona:</label>
                                <input type="hidden" th:field="*{zona}" />
                                <input type="text" class="form-control bg-light" th:value="*{zona}" disabled />
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Horario:</label>
                                <input type="hidden" th:field="*{horario}" />
                                <input type="text" class="form-control bg-light" th:value="*{horario}" disabled />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Preferencias:</label>
                                <input type="hidden" th:field="*{preferencias}" />
                                <input type="text" class="form-control bg-light" th:value="*{preferencias}" disabled />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Descripción de las necesidades:</label>
                            <input type="hidden" th:field="*{descripcion}" />
                            <textarea class="form-control bg-light" rows="3" th:text="*{descripcion}" disabled></textarea>
                        </div>

                        <hr class="mb-4">

                        <div class="mb-4">
                            <label class="form-label fw-bold text-teal h5">Nuevo Estado de la Petición:</label>
                            <select class="form-select form-select-lg border-teal" th:field="*{estado}">
                                <option value="pendiente">Pendiente</option>
                                <option value="en_revision">En revisión</option>
                                <option value="aprobada">Aprobada</option>
                                <option value="rechazada">Rechazada</option>
                                <option value="con_contrato">Con contrato</option>
                                <option value="finalizada">Finalizada</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-teal btn-lg fw-bold">Guardar Cambios</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
