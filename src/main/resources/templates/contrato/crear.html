<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Generar Contrato de Asistencia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/sgovi-style.css}" href="/css/sgovi-style.css">
</head>

<body>
    <!-- Barra de Accesibilidad -->
    <div class="accessibility-bar" role="region" aria-label="Herramientas de accesibilidad">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span><i class="bi bi-universal-access me-1" aria-hidden="true"></i> Accesibilidad y Usabilidad</span>
            <div class="d-flex gap-4">
                <button type="button" onclick="toggleFontSize('increase')" aria-label="Aumentar texto"><i class="bi bi-zoom-in"></i> Texto +</button>
                <button type="button" onclick="toggleFontSize('decrease')" aria-label="Disminuir texto"><i class="bi bi-zoom-out"></i> Texto -</button>
                <button type="button" onclick="toggleContrast()" aria-label="Alto contraste"><i class="bi bi-circle-half"></i> Alto Contraste</button>
            </div>
        </div>
    </div>

    <!-- Navegación -->
    <nav class="navbar navbar-custom sticky-top" aria-label="Navegación principal">
        <div class="container justify-content-between">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/TecnicoOVI/dashboard}">
                <i class="bi bi-heart-pulse-fill text-teal" aria-hidden="true"></i>
                <span>SgOVI - Gestión Técnica</span>
            </a>
            <a th:href="@{/APRequest/gestion/{id}(id=${request.idRequest})}" class="btn btn-sg-outline btn-sm px-3">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i> Volver a Solicitud
            </a>
        </div>
    </nav>

    <!-- Formulario Principal -->
    <main class="container py-4 flex-grow-1">
        <div class="pillar-card p-4 p-md-5">
            <div class="mb-4 border-bottom pb-3">
                <span class="hero-badge mb-2"><i class="bi bi-file-earmark-text-fill"></i> Nuevo Contrato</span>
                <h1 class="h3 fw-bold text-dark m-0">Generación de Contrato de Servicio</h1>
                <p class="text-muted-custom small m-0 mt-1">Solicitud #<span th:text="${request.idRequest}"></span> | Asistente Seleccionado: <strong th:text="${asistente.nombre + ' ' + asistente.apellidos}"></strong></p>
            </div>

            <form th:action="@{/contrato/crear}" method="post">
                <input type="hidden" name="idRequest" th:value="${request.idRequest}" />
                <input type="hidden" name="idAsistente" th:value="${asistente.idAsistente}" />

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="fechaInicio" class="form-label fw-bold">Fecha de Inicio del Servicio</label>
                        <input type="date" id="fechaInicio" name="fechaInicio" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label for="fechaFin" class="form-label fw-bold">Fecha de Finalización (Opcional)</label>
                        <input type="date" id="fechaFin" name="fechaFin" class="form-control" />
                    </div>
                    <div class="col-md-6">
                        <label for="horasSemanales" class="form-label fw-bold">Horas Semanales de Prestación</label>
                        <input type="number" id="horasSemanales" name="horasSemanales" step="0.5" class="form-control" placeholder="Ej. 20" required />
                    </div>
                    <div class="col-md-6">
                        <label for="salarioHora" class="form-label fw-bold">Tarifa por Hora (€)</label>
                        <input type="number" id="salarioHora" name="salarioHora" step="0.01" class="form-control" placeholder="Ej. 12.50" required />
                    </div>
                </div>

                <div class="mb-4">
                    <label for="contenidoHtml" class="form-label fw-bold">Cláusulas del Contrato / Modificaciones</label>
                    <textarea id="contenidoHtml" name="contenidoHtml" class="form-control" rows="8" required th:text="${plantillaBase}"></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/APRequest/gestion/{id}(id=${request.idRequest})}" class="btn btn-sg-outline">Cancelar</a>
                    <button type="submit" class="btn btn-sg-primary px-4">
                        <i class="bi bi-send-check me-1" aria-hidden="true"></i> Generar y Habilitar para Firma
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleFontSize(action) {
            const size = parseFloat(window.getComputedStyle(document.body).fontSize);
            document.body.style.fontSize = (action === 'increase' ? size + 1.5 : size - 1.5) + 'px';
        }
        function toggleContrast() { document.body.classList.toggle('high-contrast'); }
    </script>
</body>
</html>
