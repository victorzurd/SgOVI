<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Firma de Contrato (Usuario)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/sgovi-style.css}" href="/css/sgovi-style.css">
</head>

<body>
    <div class="accessibility-bar" role="region" aria-label="Herramientas de accesibilidad">
        <div class="container d-flex justify-content-between align-items-center">
            <span><i class="bi bi-universal-access me-1"></i> Accesibilidad</span>
            <div class="d-flex gap-3">
                <button type="button" onclick="toggleFontSize('increase')">Texto +</button>
                <button type="button" onclick="toggleFontSize('decrease')">Texto -</button>
                <button type="button" onclick="toggleContrast()">Alto Contraste</button>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/usuario/dashboard}">SgOVI - Portal Usuario</a>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">
        <div class="pillar-card p-4 p-md-5">

            <!-- Estado de Firmas -->
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <div>
                    <span class="hero-badge mb-2"><i class="bi bi-pen-fill"></i> Firma Digital Requsita</span>
                    <h1 class="h3 fw-bold text-dark m-0">Revisión y Firma del Contrato</h1>
                </div>
                <div class="text-end">
                    <span th:if="${contrato.firmaUsuario != null}" class="badge bg-success"><i class="bi bi-check-circle"></i> Firmado por ti</span>
                    <span th:if="${contrato.firmaUsuario == null}" class="badge bg-warning text-dark"><i class="bi bi-clock"></i> Pendiente tu firma</span>
                </div>
            </div>

            <!-- Visor del Contrato -->
            <div class="border rounded p-4 bg-light mb-4" style="max-height: 350px; overflow-y: auto;" th:utext="${contrato.contenidoHtml}">
                <!-- Contenido dinámico renderizado HTML -->
            </div>

            <!-- Panel de Firma -->
            <div th:if="${contrato.firmaUsuario == null}">
                <form th:action="@{/contrato/firmar-usuario}" method="post" id="formFirma">
                    <input type="hidden" name="idContrato" th:value="${contrato.idContrato}" />
                    <input type="hidden" name="firmaBase64" id="firmaInput" />

                    <div class="card p-3 border mb-3">
                        <label class="form-label fw-bold"><i class="bi bi-vector-pen me-1"></i> Dibuje su firma en el recuadro:</label>
                        <canvas id="canvasFirma" width="500" height="180" class="border rounded bg-white w-100" style="touch-action: none; cursor: crosshair;"></canvas>
                        
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <button type="button" class="btn btn-sm btn-sg-outline" onclick="limpiarCanvas()">
                                <i class="bi bi-eraser-fill me-1"></i> Limpiar Trazo
                            </button>
                            <small class="text-muted">Asegúrese de realizar el trazo de forma clara antes de enviar.</small>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="checkAcepto" required />
                        <label class="form-check-label small" for="checkAcepto">
                            Declaro que he leído y acepto íntegramente las condiciones reflejadas en el presente contrato.
                        </label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-sg-primary px-4 w-100">
                            <i class="bi bi-file-earmark-check-fill me-1"></i> Confirmar Firma del Usuario
                        </button>
                    </div>
                </form>
            </div>

            <div th:if="${contrato.firmaUsuario != null}" class="alert alert-success border-0 mb-0">
                <i class="bi bi-check-circle-fill me-2"></i> Ya has firmado este contrato correctamente el <strong th:text="${#dates.format(contrato.fechaFirmaUsuario, 'dd/MM/yyyy HH:mm')}"></strong>.
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const canvas = document.getElementById('canvasFirma');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let dibujando = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function empezar(e) {
                dibujando = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                e.preventDefault();
            }

            function dibujar(e) {
                if (!dibujando) return;
                const p = getPos(e);
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#0B2545';
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                e.preventDefault();
            }

            function terminar() { dibujando = false; }

            canvas.addEventListener('mousedown', empezar);
            canvas.addEventListener('mousemove', dibujar);
            canvas.addEventListener('mouseup', terminar);
            canvas.addEventListener('touchstart', empezar);
            canvas.addEventListener('touchmove', dibujar);
            canvas.addEventListener('touchend', terminar);

            function limpiarCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            document.getElementById('formFirma').addEventListener('submit', function (e) {
                const data = canvas.toDataURL();
                document.getElementById('firmaInput').value = data;
            });
        }

        function toggleFontSize(action) {
            const size = parseFloat(window.getComputedStyle(document.body).fontSize);
            document.body.style.fontSize = (action === 'increase' ? size + 1.5 : size - 1.5) + 'px';
        }
        function toggleContrast() { document.body.classList.toggle('high-contrast'); }
    </script>
</body>
</html>
