<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Eliminar Perfil</title>
    
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          type="text/css"
          th:href="@{/css/usuarioOVI.css}" />
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-teal fw-bold" th:href="@{/UsuarioOVI/dashboard}">
                SgOVI - Área Personal
            </a>
            <div class="d-flex align-items-center">
                <a th:href="@{/UsuarioOVI/logout}" class="btn btn-outline-danger btn-sm fw-bold">
                    Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 600px;">

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                
                <div class="text-center mb-4">
                    <div class="text-danger mb-2">
                        <span class="display-4 fw-bold">⚠️</span>
                    </div>
                    <h3 class="text-dark fw-bold">¿Eliminar cuenta permanentemente?</h3>
                    <p class="text-muted small">
                        Esta acción es irreversible. Se borrarán todos tus datos personales y solicitudes del sistema.
                    </p>
                </div>

                <div class="bg-light rounded-3 p-3 mb-4 d-flex flex-column gap-2">
                    
                    <div class="row text-break border-bottom pb-2">
                        <div class="col-sm-4 fw-bold text-teal">Nombre:</div>
                        <div class="col-sm-8 text-dark" th:text="${usuario.nombre}"></div>
                    </div>
                    
                    <div class="row text-break border-bottom pb-2">
                        <div class="col-sm-4 fw-bold text-teal">Apellidos:</div>
                        <div class="col-sm-8 text-dark" th:text="${usuario.apellidos}"></div>
                    </div>
                    
                    <div class="row text-break" 
                         th:classappend="${(usuario.telefono != null and usuario.telefono != '') or (usuario.direccion != null and usuario.direccion != '') ? 'border-bottom pb-2' : ''}">
                        <div class="col-sm-4 fw-bold text-teal">Email:</div>
                        <div class="col-sm-8 text-dark" th:text="${usuario.email}"></div>
                    </div>

                    <div class="row text-break" 
                         th:if="${usuario.telefono != null and usuario.telefono != ''}"
                         th:classappend="${usuario.direccion != null and usuario.direccion != '' ? 'border-bottom pb-2' : ''}">
                        <div class="col-sm-4 fw-bold text-teal">Teléfono:</div>
                        <div class="col-sm-8 text-dark" th:text="${usuario.telefono}"></div>
                    </div>

                    <div class="row text-break" 
                         th:if="${usuario.direccion != null and usuario.direccion != ''}">
                        <div class="col-sm-4 fw-bold text-teal">Dirección:</div>
                        <div class="col-sm-8 text-dark" th:text="${usuario.direccion}"></div>
                    </div>

                </div>

                <form th:action="@{/UsuarioOVI/delete/{id}(id=${usuario.idUsuario})}" method="post">
                    <div class="row g-2">
                        <div class="col-6">
                            <a th:href="@{/UsuarioOVI/perfil}" class="btn btn-outline-secondary w-100 fw-bold py-2">
                                Cancelar
                            </a>
                        </div>
                        <div class="col-6">
                            <button type="submit" class="btn btn-danger w-100 fw-bold py-2">
                                Eliminar
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>

    </main>


</body>
</html>
