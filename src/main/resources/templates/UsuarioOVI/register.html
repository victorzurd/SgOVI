<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Añadir Usuario OVI</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/usuarioOVI.css"
        th:href="@{/css/usuarioOVI.css}" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-teal fw-bold" th:href="@{/}">
                SgOVI - Usuario OVI
            </a>
        </div>
    </nav>
    <main class="container py-4">
        <h1 class="mb-4">Registrarse como Usuario</h1>

        <form th:action="@{/UsuarioOVI/register}" th:object="${usuario}" method="post">

            <div class="mb-3 col-md-4">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" class="form-control"
                    th:errorclass="needcorrection" placeholder="Nombre" />
                <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input id="apellidos" type="text" th:field="*{apellidos}" class="form-control"
                    th:errorclass="needcorrection" placeholder="Apellidos" />
                <div th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" th:field="*{email}" class="form-control"
                    th:errorclass="needcorrection" placeholder="correo@ejemplo.com" />
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" type="password" th:field="*{password}" class="form-control"
                    th:errorclass="needcorrection" placeholder="Contraseña" />
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="telefono" class="form-label">Teléfono (Opcional)</label>
                <input id="telefono" type="text" th:field="*{telefono}" class="form-control"
                    th:errorclass="needcorrection" placeholder="9 dígitos" maxlength="9" />
                <div th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="direccion" class="form-label">Dirección (Opcional)</label>
                <input id="direccion" type="text" th:field="*{direccion}" class="form-control"
                    placeholder="Dirección" />
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{consentimientoRGBD}"/>
                    <label class="form-check-label">Acepto el Consentimiento RGBD</label>
                </div>
                <div th:if="${#fields.hasErrors('consentimientoRGBD')}" th:errors="*{consentimientoRGBD}" class="error"></div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-teal">Solicitar Registro</button>
                <a th:href="@{/}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</body>

</html>
