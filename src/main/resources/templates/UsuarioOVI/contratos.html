<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Mis Contratos</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          type="text/css"
          th:href="@{/css/usuarioOVI.css}" />
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">

        <a class="navbar-brand text-teal fw-bold"
           th:href="@{/UsuarioOVI/dashboard}">
            SgOVI - Área Personal
        </a>

        <div class="d-flex align-items-center">
            <a th:href="@{/UsuarioOVI/logout}"
               class="btn btn-outline-danger btn-sm">
                Cerrar Sesión
            </a>
        </div>

    </div>
</nav>

<main class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-teal fw-bold mb-0">
            Mis Contratos de Asistencia
        </h2>

        <a th:href="@{/UsuarioOVI/dashboard}"
           class="btn btn-teal">
            Volver
        </a>

    </div>

    <th:block
        th:replace="~{fragments/buscador(action='/UsuarioOVI/contratos')}"/>

    <div class="card shadow-sm border-0 rounded-3">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-light">

                    <tr>
                        <th class="ps-4">ID Contrato</th>
                        <th>Fecha Inicio</th>
                        <th>Fecha Fin</th>
                        <th>Estado</th>
                        <th class="text-center">Documento</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="contrato : ${contratos}">

                        <td class="ps-4 fw-bold text-teal"
                            th:text="'#' + ${contrato.idContrato}">
                        </td>

                        <td th:text="${contrato.fechaInicio}">
                        </td>

                        <td th:text="${contrato.fechaFin != null ? contrato.fechaFin : 'Indefinido'}">
                        </td>

                        <td>

                            <div th:switch="${contrato.estado}">

                                <span th:case="'con_contrato'"
                                      class="badge rounded-pill bg-primary">
                                    Vigente
                                </span>

                                <span th:case="'finalizada'"
                                      class="badge rounded-pill bg-secondary">
                                    Finalizado
                                </span>

                                <span th:case="*"
                                      class="badge rounded-pill bg-dark"
                                      th:text="${contrato.estado}">
                                </span>

                            </div>

                        </td>

                        <td class="text-center">

                            <a th:if="${contrato.documentoPdf != null}"
                               th:href="@{/contratos/{pdf}(pdf=${contrato.documentoPdf})}"
                               target="_blank"
                               class="btn btn-outline-primary btn-sm">

                                📄 Ver contrato

                            </a>

                            <span th:if="${contrato.documentoPdf == null}"
                                  class="text-muted">

                                Pendiente de generar

                            </span>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(contratos)}">

                        <td colspan="5"
                            class="text-center py-5 text-muted">

                            No dispones de ningún contrato actualmente.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <th:block
        th:replace="~{fragments/paginacion :: paginacion('/UsuarioOVI/contratos')}"/>

</main>

</body>
</html>
